name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test
        run: node --test tests/

      - name: Package
        run: |
          mkdir -p dist
          (cd plugin && zip -qr ../dist/ip-quality.zip komari-plugin.json script.js lib -x "*.DS_Store")
          sha256sum dist/ip-quality.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ip-quality.zip
          generate_release_notes: true

      - name: Update v1.json on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python3 - "$TAG" "${{ github.repository }}" "$(sha256sum dist/ip-quality.zip | cut -d' ' -f1)" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          tag, repo, sha = sys.argv[1:4]
          d = json.load(open("v1.json", encoding="utf-8"))
          p = d["plugins"][0]
          p["version"] = tag.lstrip("v")
          p["download"] = f"https://github.com/{repo}/releases/download/{tag}/ip-quality.zip"
          p["sha256"] = sha
          d["updated_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z")
          json.dump(d, open("v1.json", "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          open("v1.json", "a").write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v1.json
          git diff --staged --quiet || (git commit -m "chore: update v1.json for ${TAG} [skip ci]" && git push origin main)
